[package]
name = "duckx-code"
version = "0.1.0"
edition = "2024"
description = "Modern modeless CLI code editor for 75% keyboards, with local coding through Ollama or LM Studio"
license = "MIT"

[dependencies]
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
tokio = { version = "1", features = ["full"] }
arboard = "3.4"
unicode-segmentation = "1.12"
unicode-width = "0.2"
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lsp-types = "0.97"
futures = "0.3"
ignore = "0.4"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = { version = "0.5", features = ["parser"] }
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-yaml = "0.7"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-lua = "0.5.0"
tree-sitter-php = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-sequel = "0.3.11"
tree-sitter-elixir = "0.3.5"
tree-sitter-graphql = "0.3.0"
tree-sitter-scala = "0.26.3"
tree-sitter-haskell = "0.24.1"
tree-sitter-swift = "0.7.4"
tree-sitter-zig = "1.1.2"
tree-sitter-hcl = "1.1.0"
tree-sitter-powershell = "0.26.6"
tree-sitter-xml = "0.7.0"
tree-sitter-make = "1.1.1"
tree-sitter-cmake = "0.7.5"

[[example]]
name = "keylog"
path = "tools/keylog.rs"
